<!doctype html>
<!-- The page of the browser spike, see docs/09-wasm-proef.md. scripts/build-web.sh
     puts it next to vna-gui.js and vna-gui_bg.wasm in target/web. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>vna-r</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #b0b0b0; font: 16px system-ui, sans-serif; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="vna-r-canvas"></canvas>
    <div id="loading">loading vna-r…</div>
    <script type="module">
        import init from "./vna-gui.js";
        init().catch((e) => {
            document.getElementById("loading").textContent = "vna-r could not load: " + e;
        });
    </script>
</body>
</html>
