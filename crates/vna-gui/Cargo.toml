[package]
name = "vna-gui"
version.workspace = true
description = "Desktop GUI for LiteVNA and NanoVNA-F vector network analysers (egui)"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vna-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
litevna = { path = "../litevna" }
num-complex = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
rfd = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }

# The browser build (spike): see docs/09-wasm-proef.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# The format eframe stores the settings in; the tests parse old settings strings with it.
ron = "0.12"
