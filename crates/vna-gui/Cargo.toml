[package]
name = "vna-gui"
version.workspace = true
description = "Desktop GUI for LiteVNA and NanoVNA-F vector network analysers (egui)"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vna-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
litevna = { path = "../litevna" }
num-complex = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
rfd = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
# The format eframe stores the settings in; the tests parse old settings strings with it.
ron = "0.12"
