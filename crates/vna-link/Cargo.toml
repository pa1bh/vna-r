[package]
name = "vna-link"
version.workspace = true
description = "The device thread shared by the vna-r GUI and server: commands in, events out"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
litevna = { path = "../litevna" }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
num-complex = { workspace = true }
# The WebSocket to a vna-server, native and in the browser. No TLS stack natively.
ewebsock = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A timer for the session's retries, and the page's own address (https or not).
web-sys = { workspace = true, features = ["Window", "Location"] }
wasm-bindgen = { workspace = true }
