[workspace]
resolver = "2"
members = ["crates/litevna", "crates/vna-cli", "crates/vna-gui"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/pa1bh/vna-r"

[workspace.dependencies]
serialport = "4.10"
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_plot = "0.38"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
