[workspace]
resolver = "2"
members = ["crates/litevna", "crates/vna-cli", "crates/vna-gui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
# The floor set by egui/eframe 0.37 and wgpu; nothing in this workspace needs more.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/pa1bh/vna-r"

[workspace.lints.clippy]
# `!(x > 0.0)` is used on purpose where NaN must be rejected along with the
# values on the wrong side; `x <= 0.0` would let NaN through.
neg_cmp_op_on_partial_ord = "allow"

[workspace.dependencies]
serialport = "4.10"
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
png = "0.18"
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_plot = "0.38"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
