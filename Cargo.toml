[workspace]
resolver = "2"
members = ["crates/litevna", "crates/vna-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/bashendriks/vna-r"

[workspace.dependencies]
serialport = "4.10"
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
