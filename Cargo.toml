[workspace]
resolver = "2"
members = ["crates/litevna", "crates/vna-cli", "crates/vna-gui", "crates/vna-link", "crates/vna-server"]

[workspace.package]
version = "0.4.0"
edition = "2021"
# The floor set by egui/eframe 0.37 and wgpu; nothing in this workspace needs more.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/pa1bh/vna-r"
# Released as archives on GitHub and through the flake, not on crates.io.
publish = false

[workspace.lints.clippy]
# `!(x > 0.0)` is used on purpose where NaN must be rejected along with the
# values on the wrong side; `x <= 0.0` would let NaN through.
neg_cmp_op_on_partial_ord = "allow"

[workspace.dependencies]
serialport = "4.10"
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it serde_json may read a float back one unit in the
# last place off. A sweep sent by vna-server must arrive as it was measured, and
# a calibration file should read back as it was written. Here rather than in
# vna-link alone, so that a build of one crate behaves like a build of all.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Bytes inside JSON (the client/server wire of vna-link: FIFO records, screenshots).
base64 = "0.22"
rustfft = "6.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
png = "0.18"
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_plot = "0.38"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
# std::time::Instant that also works in a browser (it is std itself on native).
web-time = "1.1"
# The client/server mode (docs/10). tungstenite in the version ewebsock 0.8 uses
# natively, so that the server and the native client share one copy.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ewebsock = "0.8"
httparse = "1.10"
flate2 = "1"
ctrlc = { version = "3.5", features = ["termination"] }
gethostname = "1.1"
# The browser build.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# The format eframe stores its settings in (vna-gui's tests read old ones with it).
ron = "0.12"
