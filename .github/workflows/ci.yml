name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # serialport needs libudev; rfd (file dialogs) needs GTK 3.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

      - name: CLI smoke test (no device)
        run: |
          ./target/release/vna-cli --help
          ./target/release/vna-cli list

  nix:
    name: nix build (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build the flake package (runs the tests)
        run: nix build -L .#vna-r
      - name: CLI smoke test
        run: |
          ./result/bin/vna-cli --help
          ./result/bin/vna-cli list
          ls -l ./result/lib/udev/rules.d/
