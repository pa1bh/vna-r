name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is GitHub's arm64 runner; the release ships an aarch64-linux archive.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # serialport needs libudev. The file dialogs (rfd) use the xdg portal at run time, no GTK.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Manuals in step (Dutch and English)
        # Once is enough; not on the arm runner as well.
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check-manuals.sh

      - name: Build
        run: cargo build --workspace --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      - name: Test the library with overflow checks (debug)
        if: runner.os == 'Linux'
        run: cargo test -p litevna

      - name: CLI smoke test (no device)
        shell: bash
        run: |
          ./target/release/vna-cli --help
          ./target/release/vna-cli list

  web:
    # The browser build (a viewer without a device, docs/09-wasm-proef.md) is the same
    # GUI code for another target. Nobody builds it day to day, so this job is what
    # keeps it from rotting: it must compile, without warnings.
    name: browser build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p vna-gui --target wasm32-unknown-unknown --release -- -D warnings

      - name: Build
        run: cargo build -p vna-gui --target wasm32-unknown-unknown --release

  nix:
    name: nix build (flake)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action deletes the superseded store caches.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # The garbage collection before the cache is saved must keep the
          # compiled dependencies (crane's deps-only derivation): nothing in the
          # final package refers to them, only its .drv does.
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true
      - name: Restore the Nix store from the previous run
        # The store holds the toolchain and the compiled dependency crates, so a
        # run only compiles the workspace itself (~2 min instead of 6 to 9). The
        # key changes with Cargo.lock or flake.lock; an older cache is still
        # restored then, and only what changed is rebuilt.
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build the flake package (runs the tests)
        run: nix build -L .#vna-r
      - name: CLI smoke test
        run: |
          ./result/bin/vna-cli --help
          ./result/bin/vna-cli list
          ls -l ./result/lib/udev/rules.d/
