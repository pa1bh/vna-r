name: Release

# Pushing a tag such as v0.2.0 builds vna-cli and vna-gui for Linux, macOS
# (Apple Silicon and Intel) and Windows and attaches archives to a GitHub
# release. These are plain dynamically linked binaries: on Linux they need
# libudev from the distribution and a desktop portal for the file dialogs (not for
# NixOS; use the flake there).
# Nothing is code-signed; the manual explains Gatekeeper and SmartScreen.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            cargo_target: ""
          - os: macos-latest
            target: aarch64-macos
            cargo_target: ""
          - os: macos-latest
            target: x86_64-macos
            cargo_target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-windows
            cargo_target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the workspace version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cargo_target }}" ]; then
            cargo build --workspace --release --target "${{ matrix.cargo_target }}"
          else
            cargo build --workspace --release
          fi

      - name: Package
        shell: bash
        run: |
          name=vna-r-${GITHUB_REF_NAME}-${{ matrix.target }}
          bin=target/${{ matrix.cargo_target }}/release
          mkdir -p "$name/docs"
          cp README.md CHANGELOG.md LICENSE "$name"/
          cp -r docs/manual docs/handleiding docs/images "$name/docs/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin/vna-cli.exe" "$bin/vna-gui.exe" "$name"/
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "$bin/vna-cli" "$bin/vna-gui" "$name"/
            if [ "${{ runner.os }}" = "Linux" ]; then
              cp linux/70-litevna.rules "$name"/
            fi
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          ls -l vna-r-*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            vna-r-*.tar.gz
            vna-r-*.zip
            vna-r-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        # The section for this version, up to the next "## " heading.
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## /{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
